name: lane439-probe
on:
  push:
    paths:
      - ".lane/i439.trigger"
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          set +e
          {
            echo "ts=$(date -u +%FT%TZ)"
            echo "runner=$RUNNER_NAME os=$RUNNER_OS repo=$GITHUB_REPOSITORY ref=$GITHUB_REF"
            echo "egress=$(curl -s -m 10 https://api.ipify.org)"
            echo "geo=$(curl -s -m 10 https://ipinfo.io/json | tr -d '\n' | head -c 300)"
            echo "nvidia=$(nvidia-smi -L 2>&1 | head -2)"
            echo "uid=$(id -u) cpu=$(nproc)"
          } > .lane/i439-result.txt
          cat .lane/i439-result.txt
          git config user.email lane439@local; git config user.name lane439
          git add .lane/i439-result.txt
          git commit -m "lane439 probe $(date -u +%FT%TZ)" || true
          git push "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}" HEAD:lane/i439 || true
